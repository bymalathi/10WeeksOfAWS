<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | CloudAdhar x TrainWithShubham</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #101827, #243b55);
      color: #ffffff;
      text-align: center;
    }

    main {
      width: min(720px, 100%);
      padding: 48px 28px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }

    .code {
      margin: 0;
      color: #ff9900;
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 1;
    }

    h1 {
      margin: 16px 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
    }

    p {
      margin: 10px auto;
      color: #dbe7f5;
      line-height: 1.6;
    }

    .brand {
      color: #ffb84d;
      font-weight: 700;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      border-radius: 8px;
      background: #ff9900;
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #ffb84d;
      outline: 3px solid rgba(255, 255, 255, 0.75);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-label="Error 404">404</p>
    <h1>Page Not Found</h1>
    <p>The page you requested does not exist in this Amazon S3 static website.</p>
    <p class="brand">CloudAdhar x TrainWithShubham</p>
    <p>AWS Zero To Hero - Amazon S3 Practical</p>
    <a href="/">Return to Home Page</a>
  </main>
</body>
</html>
